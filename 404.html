<title>Siden finnes ikke — Domheim</title>
<style>
:root{--paper:#f4efe6;--ink:#1c1915;--muted:#5c564c;--line:#d9d1c3;--accent:#5e483c;--on-accent:#fff8f3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem}
main{width:100%;max-width:36rem}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:1.35rem;font-weight:700;margin:0;color:var(--ink);text-decoration:none}
.rubro{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}
.code{font-family:Georgia,"Times New Roman",serif;font-size:clamp(4.5rem,18vw,7rem);line-height:1;font-weight:700;color:var(--accent);margin:2rem 0 .5rem}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;margin:0 0 .5rem}
h1{font-size:1.8rem}
h2{font-size:1.3rem}
p{margin:0 0 1rem}
.es{border-top:1px solid var(--line);margin-top:1.5rem;padding-top:1.25rem}
.es .rubro{margin:0 0 .75rem}
.actions{margin-top:1.75rem;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);text-decoration:none;padding:.8rem 1.4rem;border-radius:6px;font-weight:600;text-align:center}
.btn small{display:block;font-weight:400;font-size:.8rem;opacity:.9}
.btn:hover,.btn:focus-visible{filter:brightness(1.1)}
.actions a:not(.btn){color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}
.actions a:not(.btn):hover{text-decoration-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.contact{color:var(--muted);font-size:.95rem}
@media (max-width:480px){.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
</style>
